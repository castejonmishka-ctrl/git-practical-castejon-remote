<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>hello world</h1>
    <ol>
        <li>item 1</li>
        <li>item 2</li>
        <li>item 3</li>
    </ol>

    <p id="parag1">This is my practical examination</p>
    <button id="btn1">alert me</button>
    <button id="btn2">change color</button>
</body>
<script>
     const parag1 = document.getElementById("parag1");
        console.log(parag1.textContent);

     const btn1 = document.querySelector("btn1");
        btn1.forEach((btn, index) => {
            console.log(`btn1 ${index + 1}:`, btn.textContent);
        });
    
     const btn2 = document.querySelector("btn2");
        btn2.forEach((btn,index) => {
            console.log(`btn2 ${index + 1}`,btn.text.Content);
        });
    
      btn1.addEventListener('click', function () {
            alert('Button 1 triggered');
        });

      btn2.addEventListener('dblclick', function () {
            parag1.style.color = 'red';
        });
</script>
